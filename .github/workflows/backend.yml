name: Synthetic backend quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-local-embeddings:
    runs-on: windows-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          cache: pip
      - name: Install complete Windows office packages
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Offline synthetic weights, local vectors and fresh-process reload
        run: |
          python -c "import install_office; exec(install_office.NATIVE_PROBE)"
          python -m pytest -q tests/integration/test_local_embedding_runtime.py tests/tooling/test_office_installer.py tests/tooling/test_office_launcher.py --no-cov
  local-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          cache: pip
      - name: Create pinned environment
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt
          .venv/Scripts/python -m pip install --no-deps -e .
      - name: All mandatory checks
        run: .venv/Scripts/python scripts/check.py
      - name: Synthetic benchmark
        run: .venv/Scripts/python scripts/benchmark.py
  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NL2SQL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          cache: pip
      - name: Install pinned application and Redis test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Real Lua, active leases and spawned API workers
        run: python -m pytest -q tests/integration/test_redis.py tests/integration/test_redis_workers.py --no-cov

  macos-contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          cache: pip
      - name: Install pinned backend and quality tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install --no-deps -e .
      - name: Native embedded graph, persistence, compiler and API contracts
        run: .venv/bin/python scripts/check.py
